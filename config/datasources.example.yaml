# 数据源配置。复制为 datasources.yaml 后使用
# TODO(datasource): 全部为占位，真实数据源确定后填写
version: 1

# 每类数据的主源与降级链。data-engineer 按顺序尝试，
# 一旦降级必须记录在 dataset.json 的 provenance.fallback_from
blocks:
  ohlcv:
    primary: EXAMPLE_SOURCE_A
    fallbacks: [EXAMPLE_SOURCE_B]
  financials:
    primary: EXAMPLE_SOURCE_B
    fallbacks: []
  valuation:
    primary: EXAMPLE_SOURCE_B
    fallbacks: []
  announcements:
    primary: EXAMPLE_SOURCE_C
    fallbacks: []
  news:
    primary: EXAMPLE_SOURCE_C
    fallbacks: [EXAMPLE_SOURCE_D]
  moneyflow:
    primary: EXAMPLE_SOURCE_A
    fallbacks: []
  social:
    primary: NONE          # 未配置 → sentiment-analyst 会 blocked
    fallbacks: []

sources:
  EXAMPLE_SOURCE_A:
    kind: placeholder
    auth_env: ~            # 凭证从哪个环境变量读
    rate_limit_per_min: 0
    notes: "TODO(datasource): 候选 akshare / baostock"
  EXAMPLE_SOURCE_B:
    kind: placeholder
    auth_env: TUSHARE_TOKEN
    rate_limit_per_min: 0
    notes: "TODO(datasource): 候选 tushare（需积分）"
  EXAMPLE_SOURCE_C:
    kind: placeholder
    auth_env: NEWS_API_KEY
    notes: "TODO(datasource): 公告与新闻源"
  EXAMPLE_SOURCE_D:
    kind: placeholder
    auth_env: NEWS_API_KEY
    notes: "TODO(datasource): 新闻备用源"
