# 数据源配置。复制为 datasources.yaml 后使用
# 当前只确认了 OHLCV 数据源；其余类别保持 NONE。
version: 1

# 每类数据的主源与降级链。data-engineer 按顺序尝试，
# 一旦降级必须记录在 dataset.json 的 provenance.fallback_from
blocks:
  ohlcv:
    primary: AKSHARE_EASTMONEY
    fallbacks: [AKSHARE_TENCENT]
  financials:
    primary: NONE
    fallbacks: []
  valuation:
    primary: NONE
    fallbacks: []
  announcements:
    primary: NONE
    fallbacks: []
  news:
    primary: NONE          # 等用户确认新闻 API；不要调用 fetch_news
    fallbacks: []
  moneyflow:
    primary: NONE
    fallbacks: []
  social:
    primary: NONE          # 未配置 → sentiment-analyst 会 blocked
    fallbacks: []

sources:
  AKSHARE_EASTMONEY:
    kind: python_library
    auth_env: ~            # 凭证从哪个环境变量读
    interface: stock_zh_a_hist
    upstream: Eastmoney
    notes: "仅用于 A 股 OHLCV；每次响应都要校验字段并记录 provenance"
  AKSHARE_TENCENT:
    kind: python_library
    auth_env: ~
    interface: stock_zh_a_hist_tx
    upstream: Tencent
    notes: "仅作日线备用源；成交量从股换算为手，换手率从小数换算为百分比"
