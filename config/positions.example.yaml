# 我的持仓。复制为 positions.yaml 后填写（positions.yaml 不入库，见 .gitignore）
#
# 为什么手填而不是截图识别：
#   填这张表会强迫你把「买入逻辑」写下来。
#   而「买入逻辑是否仍成立」正是章节四要回答的第一个问题——
#   没写下来，第二天你只会临时编一个理由说服自己继续拿着。
#
# 账户总资产不写在这里，写在 .env 的 ASTOCK_ACCOUNT_EQUITY（章节七算风险要用）
version: 1

positions:
  - code: "000000.SZ"        # 六位代码 + .SH/.SZ/.BJ
    name: "示例科技"           # 可选，只为看着方便
    cost: 12.80              # 成本价（元）
    shares: 2000             # 数量（股）
    buy_date: "2026-08-25"
    module: "打板"            # 交易模块：打板 / 低吸 / 趋势 / 套利 / 中线
    sector: "示例题材"         # 我认为它属于哪个题材（章节七按这个聚合同题材风险）
    thesis: "题材启动第二天打板做龙头，看三日内能否走出高度"   # 买入逻辑，越具体越好
    stop_level: 11.50        # 失效位：破了就承认判断错了（买入时就该定，不许事后下调）

  # - code: "000001.SZ"
