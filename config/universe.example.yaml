# 股票池定义。复制为 universe.yaml 后使用（universe.yaml 不入库）
version: 1

# 代码 → 名称的映射，orchestrator 用它把公司名反查成代码
aliases:
  "000000.SZ": "示例科技"        # 虚构标的，仅用于示例 run

# 分组，方便批量分析
groups:
  demo:
    description: 教学示例用
    codes: ["000000.SZ"]

