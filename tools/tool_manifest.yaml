# 工具注册表 —— agent 只允许调用登记在此的工具
version: 1

tools:
  - name: astock
    entry: tools/astock.py
    status: implemented
    description: |
      统一入口与流程状态机。任何 coding agent 只需要记住这一个命令。
      doctor 环境自检 / review 开工 / next 我该做什么 / done 校验并推进 / status 进度 / demo 离线示例。
      next 会读 run_manifest 的状态与 agents/*.md 的 frontmatter，
      把"下一步该做什么"渲染成可执行指令——所以 agent 不需要记流程。
    allowed_agents: [orchestrator, data-engineer, market-analyst, sector-analyst,
                     news-analyst, position-advisor, report-writer]
    input:
      cmd: "doctor | review | next | done | status | demo"
      run_id: "str  可选，默认取最近一个 run"
      as_of: "str  可选，默认按当前时间推断"
      mode: "str  close | premarket | positions | weekly"
    output:
      next_agent: str
      reads: "list[str]"
      writes: "list[str]"
      schema: str
      finish_command: str

  - name: sync_harness
    entry: tools/sync_harness.py
    status: implemented
    description: 从 agents/ 与 AGENTS.md 生成 .claude / .opencode / .cursor / .codex 的适配文件
    allowed_agents: []          # 维护用，不在复盘流程里调
    input: {check: "bool  只检查是否同步"}
    output: {generated: int, drift: "list[str]"}

  - name: init_run
    entry: tools/init_run.py
    status: implemented
    description: 创建一次复盘运行的 workspace 目录，按运行模式写入初始 run_manifest.json
    allowed_agents: [orchestrator]
    input:
      as_of: "str  YYYY-MM-DD"
      mode: "str  close | premarket | positions | weekly"
      slug: "str  可选，run 目录后缀，默认用 mode"
    output: {run_id: str, run_dir: str, mode: str, steps: "list[str]"}

  - name: fetch_dataset
    entry: tools/fetch_dataset.py
    status: implemented
    description: 用 AKShare 取当日全部数据并写出 dataset.json（scripts/build_dataset.py 的薄封装）
    allowed_agents: [data-engineer]
    input:
      run_id: str
      as_of: str
      no_cache: "bool  忽略本地缓存强制重取"
    output: {ok: bool, artifact: str, detail_csv_dir: str}

  - name: compute_risk
    entry: tools/compute_risk.py
    status: implemented
    description: 计算总仓位、单票与同题材集中度、单笔风险与 0.5% 线（章节七）
    allowed_agents: [position-advisor]
    input: {run_id: str}
    output:
      account_equity: float
      total_position_pct: float
      concentration: "list[dict]"
      per_trade_risk: "list[dict]"

  - name: render_report
    entry: tools/render_report.py
    status: implemented
    description: 把 report.json 渲染成 report.md 与单文件 HTML 仪表盘
    allowed_agents: [report-writer]
    input: {run_id: str}
    output: {ok: bool, md: str, html: str}

  - name: validate_artifact
    entry: tools/validate_artifact.py
    status: implemented
    description: 用 schemas/ 校验某个 run 产物是否合规
    allowed_agents: [orchestrator, data-engineer, market-analyst, sector-analyst,
                     news-analyst, position-advisor, report-writer]
    input:
      run_id: str
      artifact: "run_manifest | dataset | market | sectors | positions_review | news | report"
    output: {valid: bool, errors: "list[str]"}

  - name: make_demo_run
    entry: tools/make_demo_run.py
    status: implemented
    description: 生成一份全虚构的示例 run，用于离线演示与教学（不联网）
    allowed_agents: []          # 只给人用，agent 不应调用
    input: {run_id: str, as_of: str}
    output: {ok: bool, run_dir: str, files: "list[str]"}
